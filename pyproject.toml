[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airguard-data"
version = "0.1.0"
description = "AirGuard Hanoi data feasibility probe"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "pandas",
    "matplotlib",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[project.scripts]
airguard-data = "airguard_data.cli:main"

[tool.pytest.ini_options]
addopts = "-v"
testpaths = ["tests"]
